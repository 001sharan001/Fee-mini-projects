<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHESS BOARD</title>
</head>
<style>
    body {
        display : flex;
        justify-content : center;
        align-items : center;
        font-family : Arial;
        flex-direction : column;
        background-color : lightgray;
        height : 100vh;
    }
    h2 {
        margin-top : 20px;
    }
    .board {
        width : 480px;
        height : 480px;
        margin : auto;
        border : 5px solid black;
        display : grid;
        grid-template-columns : repeat(8,1fr);
        grid-template-rows : repeat(8,1fr);
    }
    .white {
        background-color :white; 
    }
    .black {
        background-color : black;
    }

</style>
<body>
    <h2><b>CHESS BOARD</b></h2>
    <div class = "board">
        <!-- ROW 1 -->
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>

        <!-- ROW 2 -->
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        
        <!-- ROW 3 -->
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>

        <!-- ROW 4 -->
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>

        <!-- ROW 5 -->
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>

        <!-- ROW 6 -->
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>

        <!-- ROW 7 -->
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>

        <!-- ROW 8 -->
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
        <div class = "black"></div>
        <div class = "white"></div>
    </div>
</body>
</html>
